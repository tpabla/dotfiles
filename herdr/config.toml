onboarding = false

[keys]
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
split_horizontal = "prefix+double_quote"
split_vertical = "prefix+percent"
navigate_pane_down = ""
navigate_pane_up = ""
navigate_workspace_down = ["j", "down"]
navigate_workspace_up = ["k", "up"]

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "local.vim-navigator.left"
description = "Vim-aware pane left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "local.vim-navigator.down"
description = "Vim-aware pane down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "local.vim-navigator.up"
description = "Vim-aware pane up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "local.vim-navigator.right"
description = "Vim-aware pane right"

[terminal]
# Render pane images (snacks.image / mermaid in nvim) in kitty
kitty_graphics = true

[ui]
sidebar_max_width = 48
status_indicators = "symbols"

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "tab"],
  [{ token = "workspace", bold = false, dim = true }, { token = "pane", dim = true }, { token = "agent", dim = true }],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "tab"],
  [{ token = "terminal_title_stripped", dim = true }],
  [{ token = "workspace", bold = false, dim = true }, { token = "pane", dim = true }, { token = "agent", dim = true }],
]
