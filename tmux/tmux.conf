# kitty things
set-environment -g KITTY_LISTEN_ON "$KITTY_LISTEN_ON"
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ',xterm-256color:OSC-52=Weird:enable'
set -as terminal-features ',xterm-kitty:allow-passthrough'
set-option -g allow-passthrough on

if-shell "[[ -z $WORK ]]" "unbind C-b; set -g prefix C-a; bind C-a send-prefix"

# setw -g mode-keys vim
set -g mouse on
set -g set-clipboard on

# don't rename windows automatically
set-option -g allow-rename off

# layout
set -g status-position bottom
# if-shell "[ -n \"$WORK\" ]" "set -g status-position bottom"
set -g extended-keys off

set-window-option -g automatic-rename off


# catppuccin v2 API. The former v1 options here (@catppuccin_flavour,
# @catppuccin_status_modules_left/right, the *_separator and *_fill settings)
# were removed upstream and were silently doing nothing -- note the option is
# spelled "flavor", so macchiato was never applied and the bar rendered mocha.
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "slanted"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_directory_text "#{pane_current_path}"
set -g @catppuccin_date_time_text "%Y-%m-%d %H:%M:%S"

# Neon accents over the macchiato base. Catppuccin sets @thm_* with `set -ogq`
# (don't-overwrite), so values defined here win.
set -g @thm_mauve    "#f26bff"   # current window number, synchronized panes
set -g @thm_lavender "#61e2ff"   # active pane border, battery
set -g @thm_pink     "#ff8ae2"
set -g @thm_sky      "#45f5ff"
set -g @thm_teal     "#2ee6c8"
set -g @thm_green    "#5df58f"
set -g @thm_yellow   "#ffe066"
set -g @thm_peach    "#ff9e5e"
set -g @thm_red      "#ff4d6d"
set -g @thm_blue     "#5bc8ff"

# cpu module carries RAM too. tmux-net-speed is Linux-only, so it is not used.
set -g @catppuccin_cpu_text " #{l:#{cpu_percentage}} #{l:#{ram_percentage}}"

# prefix-highlight: neon indicator when the prefix is armed or a mode is active
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_prefix_prompt 'PREFIX'
set -g @prefix_highlight_copy_prompt 'COPY'
set -g @prefix_highlight_sync_prompt 'SYNC'
set -g @prefix_highlight_fg '#11111b'
set -g @prefix_highlight_bg '#f26bff'
set -g @prefix_highlight_copy_mode_attr 'fg=#11111b,bg=#61e2ff,bold'
set -g @prefix_highlight_sync_mode_attr 'fg=#11111b,bg=#ffe066,bold'



# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind J swap-pane -D
bind K swap-pane -U

# Splits: keep default keys but open in current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind %  split-window -h -c "#{pane_current_path}"

# Main-vertical layout: big editor on the left, stack on the right
set -g main-pane-width 65%
bind = select-layout main-vertical    # snap window back to main-vertical
bind + select-layout -E               # spread current layout evenly

# Promote current pane to the main (left) slot
bind Enter swap-pane -s : -t :.0 \; select-pane -t :.0

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'samleeney/tmux-agent-status'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# resurrect: capture pane contents and restore vim/nvim sessions
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# continuum: auto-save every 15 min, auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# agent-status: sidebar + status-line state for Claude Code and Codex, fed by
# their lifecycle hooks (see README). Park is remapped off `p` so tmux keeps
# previous-window; the other keys (S, o, N, W) are unbound in stock tmux.
set -g @agent-status-key "S"        # fzf switcher popup
set -g @agent-sidebar-key "o"       # focus/create sidebar
set -g @agent-next-done-key "N"     # jump to next inbox item
set -g @agent-wait-key "W"
set -g @agent-park-key "P"

set -g @agent-switcher-style "both"
set -g @agent-switcher-default-mode "agents"
set -g @agent-sidebar-width "38"
set -g @agent-notification-sound "chime"

# Load catppuccin first so the module variables exist, then bake them into the
# status line with -F. tpm then runs tmux-cpu/tmux-battery, which substitute
# their placeholders into that baked string -- so this ordering is required.
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_user}#{E:@catppuccin_status_host}"
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

run '~/.tmux/plugins/tpm/tpm'

# tmux-agent-status appends its agent glyphs to status-right when tpm runs it;
# the prefix indicator goes last.
set -ag status-right "#{prefix_highlight}"

